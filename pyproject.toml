[project]
name = "python-auth-cli"
version = "0.1.0"
description = ""
authors = [
    {name = "SenhorDosSonhos1",email = "marcelosamu2002@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pytest (>=9.1.1,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.7,<0.17.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.taskipy.tasks]
lint = "ruff check ."
format = "ruff format ."
run = "python main.py"